<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Anime Transition — Preview</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0b0712;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* ---- mock page behind the overlay ---- */
  .page {
    text-align: center;
    color: #cbb8e8;
  }
  .page h1 { font-size: 28px; font-weight: 600; color: #e9def8; margin-bottom: 8px; }
  .page p { font-size: 15px; opacity: .6; margin-bottom: 28px; }
  .trigger {
    border: none;
    cursor: pointer;
    padding: 14px 30px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(135deg, #d4537e, #7f77dd);
    box-shadow: 0 8px 30px rgba(168,85,247,.35);
    transition: transform .15s ease;
  }
  .trigger:active { transform: scale(.97); }

  /* ---- transition overlay ---- */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at 50% 45%, #2a1c47 0%, #170f2b 55%, #0c0818 100%);
    opacity: 0;
    pointer-events: none;
  }
  .overlay.show {
    animation: curtain 2000ms ease forwards;
    pointer-events: auto;
  }
  @keyframes curtain {
    0%   { opacity: 0; }
    18%  { opacity: 1; }
    78%  { opacity: 1; }
    100% { opacity: 0; }
  }

  .stage {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    transform: scale(.9);
    opacity: 0;
  }
  .overlay.show .stage { animation: rise 2000ms cubic-bezier(.22,1,.36,1) forwards; }
  @keyframes rise {
    0%   { opacity: 0; transform: scale(.86); }
    22%  { opacity: 1; transform: scale(1); }
    80%  { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.04); }
  }

  /* concentric rings */
  .ring {
    position: absolute;
    top: 50%; left: 50%;
    border: 1px solid rgba(168,85,247,.22);
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }
  .overlay.show .ring { animation: pulse 2200ms ease-out infinite; }
  .ring.r1 { width: 240px; height: 240px; }
  .ring.r2 { width: 240px; height: 240px; animation-delay: .6s !important; }
  @keyframes pulse {
    0%   { transform: translate(-50%, -50%) scale(.55); opacity: .55; }
    100% { transform: translate(-50%, -50%) scale(1.7); opacity: 0; }
  }

  /* the katakana wordmark */
  .word {
    position: relative;
    font-size: clamp(64px, 12vw, 120px);
    font-weight: 800;
    line-height: 1;
    letter-spacing: .04em;
    background: linear-gradient(180deg, #ff79b0 0%, #d758e8 45%, #a855f7 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 22px rgba(192,72,224,.55))
            drop-shadow(0 0 48px rgba(168,85,247,.35));
  }

  /* drifting petal specks layered over the glyphs */
  .petals { position: absolute; inset: -10% -6%; pointer-events: none; }
  .petal {
    position: absolute;
    width: 9px; height: 9px;
    background: linear-gradient(135deg, #ff9ec7, #ff6fae);
    border-radius: 60% 0 60% 0;
    opacity: 0;
    filter: drop-shadow(0 0 5px rgba(255,120,180,.7));
  }
  .overlay.show .petal { animation: drift 2000ms ease-in-out forwards; }
  @keyframes drift {
    0%   { opacity: 0; transform: translateY(8px) rotate(0deg) scale(.6); }
    25%  { opacity: 1; }
    75%  { opacity: 1; }
    100% { opacity: 0; transform: translateY(-22px) rotate(160deg) scale(1); }
  }

  .caption {
    margin-top: 22px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .42em;
    text-indent: .42em;
    text-transform: uppercase;
    color: #b8a6dd;
    opacity: .85;
  }

  .replay {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    z-index: 10; font-size: 13px; color: #6b5b8a;
  }
</style>
</head>
<body>
  <div class="page">
    <h1>CineFlow</h1>
    <p>Click the button to watch the Anime transition</p>
    <button class="trigger" onclick="play()">Go to Anime →</button>
  </div>

  <div class="overlay" id="overlay">
    <span class="ring r1"></span>
    <span class="ring r2"></span>
    <div class="stage">
      <div class="word">
        アニメ
        <div class="petals" id="petals"></div>
      </div>
      <div class="caption">Switching to Anime</div>
    </div>
  </div>

  <div class="replay">Tip: this is the exact effect — it auto-hides after ~2s</div>

<script>
  // sprinkle petal specks across the wordmark
  const wrap = document.getElementById('petals');
  for (let i = 0; i < 16; i++) {
    const p = document.createElement('span');
    p.className = 'petal';
    p.style.left = Math.random() * 100 + '%';
    p.style.top = Math.random() * 100 + '%';
    p.style.animationDelay = (Math.random() * 0.5) + 's';
    p.style.transform = `scale(${0.6 + Math.random() * 0.8})`;
    wrap.appendChild(p);
  }

  const overlay = document.getElementById('overlay');
  function play() {
    overlay.classList.remove('show');
    void overlay.offsetWidth; // restart animation
    overlay.classList.add('show');
    setTimeout(() => overlay.classList.remove('show'), 2000);
  }
  // autoplay once on load
  window.addEventListener('load', () => setTimeout(play, 400));
</script>
</body>
</html>
